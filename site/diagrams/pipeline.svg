<text x='900.0' y='642' text-anchor='middle' font-size='12' fill='#33475B' font-family='Inter, Helvetica, Arial, sans-serif'>Retry with same event_id</text>
<text x='900.0' y='659' text-anchor='middle' font-size='12' fill='#33475B' font-family='Inter, Helvetica, Arial, sans-serif'>Failed model keeps last good data</text>
