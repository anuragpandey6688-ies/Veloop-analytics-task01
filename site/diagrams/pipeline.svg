<text x='320.0' y='1044' text-anchor='middle' font-size='12' fill='#33475B' font-family='Inter, Helvetica, Arial, sans-serif'>Founder, Product, Operations, Finance</text>
<text x='320.0' y='1061' text-anchor='middle' font-size='12' fill='#33475B' font-family='Inter, Helvetica, Arial, sans-serif'>Definitions versioned in change log (Q)</text>
