<text x='320.0' y='776' text-anchor='middle' font-size='12' fill='#33475B' font-family='Inter, Helvetica, Arial, sans-serif'>Daily KPI tables on IST day, production only (QC-16)</text>
<text x='320.0' y='793' text-anchor='middle' font-size='12' fill='#33475B' font-family='Inter, Helvetica, Arial, sans-serif'>Reconciliation QC-13 must pass before refresh</text>
<line x1='320.0' y1='830' x2='320.0' y2='862' stroke='#1F3A5F' stroke-width='2' marker-end='url(#ah)'/>
<rect x='60' y='864' width='520' height='100' rx='10' fill='#F1ECFB' stroke='#1F3A5F' stroke-width='1.5'/>
