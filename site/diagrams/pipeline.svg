<svg xmlns='http://www.w3.org/2000/svg' width='1180' height='1142' viewBox='0 0 1180 1142'>
<defs><marker id='ah' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#1F3A5F'/></marker></defs>
<rect width='100%' height='100%' fill='white'/>
<text x='590.0' y='34' text-anchor='middle' font-size='20' font-weight='700' fill='#10233D' font-family='Inter, Helvetica, Arial, sans-serif'>VELOOP analytics pipeline (proposed, Stage 1 with Stage 2 upgrade path)</text>
<rect x='60' y='60' width='520' height='100' rx='10' fill='#E8F0FB' stroke='#1F3A5F' stroke-width='1.5'/>
<text x='320.0' y='84' text-anchor='middle' font-size='15' font-weight='700' fill='#10233D' font-family='Inter, Helvetica, Arial, sans-serif'>1 VELOOP Application</text>
<text x='320.0' y='106' text-anchor='middle' font-size='12' fill='#33475B' font-family='Inter, Helvetica, Arial, sans-serif'>Web app (client events: views, opens, onboarding)</text>
<text x='320.0' y='123' text-anchor='middle' font-size='12' fill='#33475B' font-family='Inter, Helvetica, Arial, sans-serif'>Backend services: accounts, tasks, rewards,</text>
<text x='320.0' y='140' text-anchor='middle' font-size='12' fill='#33475B' font-family='Inter, Helvetica, Arial, sans-serif'>wallet, withdrawals, referrals</text>
<line x1='320.0' y1='160' x2='320.0' y2='192' stroke='#1F3A5F' stroke-width='2' marker-end='url(#ah)'/>
<rect x='60' y='194' width='520' height='100' rx='10' fill='#E8F0FB' stroke='#1F3A5F' stroke-width='1.5'/>
<text x='320.0' y='218' text-anchor='middle' font-size='15' font-weight='700' fill='#10233D' font-family='Inter, Helvetica, Arial, sans-serif'>2 Application Events</text>
<text x='320.0' y='240' text-anchor='middle' font-size='12' fill='#33475B' font-family='Inter, Helvetica, Arial, sans-serif'>Server events via transactional outbox (money, status)</text>
<text x='320.0' y='257' text-anchor='middle' font-size='12' fill='#33475B' font-family='Inter, Helvetica, Arial, sans-serif'>Client events to one validated endpoint</text>
<text x='320.0' y='274' text-anchor='middle' font-size='12' fill='#33475B' font-family='Inter, Helvetica, Arial, sans-serif'>event_id + schema_version + data_environment</text>
