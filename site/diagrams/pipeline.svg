<text x='900.0' y='508' text-anchor='middle' font-size='12' fill='#33475B' font-family='Inter, Helvetica, Arial, sans-serif'>Freshness, volume anomalies,</text>
<text x='900.0' y='525' text-anchor='middle' font-size='12' fill='#33475B' font-family='Inter, Helvetica, Arial, sans-serif'>test failures, quarantine counts</text>
<text x='900.0' y='542' text-anchor='middle' font-size='12' fill='#33475B' font-family='Inter, Helvetica, Arial, sans-serif'>-&gt; team channel alert</text>
