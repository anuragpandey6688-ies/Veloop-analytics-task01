<text x='320.0' y='642' text-anchor='middle' font-size='12' fill='#33475B' font-family='Inter, Helvetica, Arial, sans-serif'>Scheduled SQL / dbt Core (free)</text>
<text x='320.0' y='659' text-anchor='middle' font-size='12' fill='#33475B' font-family='Inter, Helvetica, Arial, sans-serif'>Clean tables, normalisation, derived fields with as-of time</text>
