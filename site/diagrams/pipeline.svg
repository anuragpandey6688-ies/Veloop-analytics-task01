<text x='320.0' y='910' text-anchor='middle' font-size='12' fill='#33475B' font-family='Inter, Helvetica, Arial, sans-serif'>Metabase OSS or Looker Studio</text>
<text x='320.0' y='927' text-anchor='middle' font-size='12' fill='#33475B' font-family='Inter, Helvetica, Arial, sans-serif'>7 dashboards (deliverable 14), stale-data banner</text>
<line x1='320.0' y1='964' x2='320.0' y2='996' stroke='#1F3A5F' stroke-width='2' marker-end='url(#ah)'/>
<rect x='60' y='998' width='520' height='100' rx='10' fill='#F1ECFB' stroke='#1F3A5F' stroke-width='1.5'/>
