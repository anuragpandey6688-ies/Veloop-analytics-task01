<rect x='60' y='328' width='520' height='100' rx='10' fill='#FFF4E0' stroke='#1F3A5F' stroke-width='1.5'/>
<text x='320.0' y='352' text-anchor='middle' font-size='15' font-weight='700' fill='#10233D' font-family='Inter, Helvetica, Arial, sans-serif'>3 Raw Data Storage</text>
<text x='320.0' y='374' text-anchor='middle' font-size='12' fill='#33475B' font-family='Inter, Helvetica, Arial, sans-serif'>raw_events table + business tables (read replica)</text>
<text x='320.0' y='391' text-anchor='middle' font-size='12' fill='#33475B' font-family='Inter, Helvetica, Arial, sans-serif'>Stage 2 only if load justifies: object storage + warehouse</text>
<text x='320.0' y='408' text-anchor='middle' font-size='12' fill='#33475B' font-family='Inter, Helvetica, Arial, sans-serif'>quarantine table for rejected rows</text>
<line x1='320.0' y1='428' x2='320.0' y2='460' stroke='#1F3A5F' stroke-width='2' marker-end='url(#ah)'/>
<rect x='60' y='462' width='520' height='100' rx='10' fill='#FDECEC' stroke='#1F3A5F' stroke-width='1.5'/>
<text x='320.0' y='486' text-anchor='middle' font-size='15' font-weight='700' fill='#10233D' font-family='Inter, Helvetica, Arial, sans-serif'>4 Validation</text>
<text x='320.0' y='508' text-anchor='middle' font-size='12' fill='#33475B' font-family='Inter, Helvetica, Arial, sans-serif'>QC-01..QC-11: IDs, enums, timestamps (UTC),</text>
<text x='320.0' y='525' text-anchor='middle' font-size='12' fill='#33475B' font-family='Inter, Helvetica, Arial, sans-serif'>required fields, naming, dedup on event_id</text>
